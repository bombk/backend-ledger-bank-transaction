version: '3.8'

services:
  backend:
    build: 
      context: ./backend-ledger-bank-transaction
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend-ledger-bank-transaction/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-ledger-bank
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
